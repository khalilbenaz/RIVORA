name: Cleanup GitHub Packages

# Opération destructive et irréversible — garde-fous:
#   1. confirm=DELETE obligatoire (sinon échec immédiat)
#   2. dry_run=true par défaut (liste sans supprimer)
#   3. allowlist explicite des packages à supprimer (plus de filtre inversé
#      qui supprimait TOUT le compte sauf RVR.CLI)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper DELETE pour confirmer la suppression"
        required: true
        default: ""
      dry_run:
        description: "true = lister sans supprimer (défaut)"
        required: true
        default: "true"
      packages:
        description: "Noms exacts des packages NuGet à supprimer (séparés par des espaces)"
        required: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard — require explicit confirmation
        if: ${{ inputs.confirm != 'DELETE' }}
        run: |
          echo "::error::Confirmation manquante. Relancer avec confirm=DELETE."
          exit 1

      - name: Delete listed packages (dry-run by default)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          for pkg in $PACKAGES; do
            if [ "$pkg" = "RVR.CLI" ]; then
              echo "Refus de supprimer RVR.CLI (package protégé)"
              continue
            fi
            echo "Target package: $pkg (dry_run=$DRY_RUN)"

            VERSIONS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/nuget/$pkg/versions")

            echo "$VERSIONS" | jq -r '.[].id' | while read vid; do
              if [ "$DRY_RUN" = "false" ]; then
                curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/user/packages/nuget/$pkg/versions/$vid"
                echo "  Deleted version $vid"
              else
                echo "  [dry-run] would delete version $vid"
              fi
            done

            if [ "$DRY_RUN" = "false" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/packages/nuget/$pkg"
              echo "  Package $pkg deleted"
            else
              echo "  [dry-run] would delete package $pkg"
            fi
          done

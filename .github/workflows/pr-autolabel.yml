name: PR Autolabel

# L'autolabeler de release-drafter.yml (branche → label) ne tournait qu'au moment
# du tag, quand les PR étaient déjà fermées — version-resolver retombait donc
# toujours sur `patch`. Ce workflow applique les labels au fil de l'eau sur les PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    name: Apply labels from branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run release-drafter autolabeler only
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7.5.1
        with:
          config-name: release-drafter.yml
          disable-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

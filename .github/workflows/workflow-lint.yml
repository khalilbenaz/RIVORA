name: Workflow Lint

# Lint les workflows eux-mêmes: actionlint (erreurs d'expressions, shellcheck des
# scripts inline, needs invalides) + zizmor (audit sécurité: injection, tokens)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # severity=warning: ignore le bruit style/info de shellcheck (SC2086/SC2129)
      # sur les scripts inline, ne bloque que warnings et erreurs réels
      - name: Run actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: docker run --rm -v "$PWD:/repo" --workdir /repo -e SHELLCHECK_OPTS rhysd/actionlint:latest -color

  zizmor:
    name: zizmor (security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor --format sarif . > zizmor.sarif || true

      - name: Upload SARIF to Code Scanning
        if: hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor

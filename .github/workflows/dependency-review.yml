name: Dependency Review

# Bloque les PR qui introduisent une dépendance avec CVE connue ou licence
# incompatible (couvre NuGet via Directory.Packages.props + npm frontend/website)
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write # pour comment-summary-in-pr

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-3.0-only
          comment-summary-in-pr: on-failure

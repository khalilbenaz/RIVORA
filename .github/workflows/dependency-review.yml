name: Dependency Review

# Bloque les PR qui introduisent une dépendance avec CVE connue ou licence
# incompatible (couvre NuGet via Directory.Packages.props + npm frontend/website)
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write # pour comment-summary-in-pr

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-3.0-only
          comment-summary-in-pr: on-failure

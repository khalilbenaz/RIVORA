name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # credentials conservés: ce job pousse le CHANGELOG sur main

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      # Pack self-contained depuis le tag — l'ancien téléchargement de l'artifact
      # `nuget-packages` depuis ci.yml était une race condition (publish-nuget pas
      # encore terminé au moment où release.yml s'exécutait) → releases sans .nupkg
      - name: Pack NuGet packages from tag
        run: |
          dotnet pack RVR.Framework.sln -c Release -o ./artifacts \
            /p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      # Génère l'entrée AVANT de changer de branche (changelog_entry.md est untracked,
      # il survit au checkout; les refs $TAG/$PREV_TAG sont explicites donc valides
      # quel que soit le HEAD courant)
      - name: Generate CHANGELOG update
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          {
            echo "## [$TAG] - $(date +%Y-%m-%d)"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG"
            else
              git log --pretty=format:"- %s (%h)" "$TAG"
            fi
            echo ""
            echo ""
          } > changelog_entry.md

          cat changelog_entry.md

      # Bascule sur main AVANT de modifier CHANGELOG.md — l'ancien ordre (modifier
      # puis checkout) faisait avorter `git checkout main` dès que main avait divergé
      - name: Update CHANGELOG.md on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          if [ -f CHANGELOG.md ]; then
            # Insert new entry after the first heading line
            awk '
              /^# / && !inserted {
                print
                getline
                print
                while ((getline line < "changelog_entry.md") > 0) print line
                print ""
                inserted=1
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              cat changelog_entry.md
            } > CHANGELOG.md
          fi

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No CHANGELOG changes to commit."
          else
            git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
            git push origin main
          fi

      # Publication APRÈS le commit CHANGELOG: un push rejeté ne laisse pas
      # une release publiée avec un CHANGELOG non mis à jour
      - name: Create release with Release Drafter
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        with:
          config-name: release-drafter.yml
          version: ${{ steps.version.outputs.VERSION }}
          tag: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NuGet packages to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

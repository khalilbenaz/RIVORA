# GitHub Actions CI Pipeline for RIVORA Framework
# Complete CI/CD with Build, Test, Coverage, Security Scan

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
      - 'bugfix/*'
      - 'hotfix/*'
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '*.sln'
      - 'global.json'
      - 'nuget.config'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '*.sln'
      - 'global.json'
      - 'nuget.config'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_VERSION: '9.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  COVERAGE_THRESHOLD: 80

jobs:
  # Job 1: Build Matrix
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Release]
        include:
          # Debug build only on Linux — Debug on all 3 OS doubles cost for little signal
          - os: ubuntu-latest
            configuration: Debug

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RVR.Framework.sln

      - name: Build
        run: dotnet build RVR.Framework.sln --configuration ${{ matrix.configuration }} --no-restore --verbosity minimal

  # Job 2: Unit + Integration Tests (single restore+build, two --no-build test passes)
  tests:
    name: Tests (Unit & Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RVR.Framework.sln

      - name: Build
        run: dotnet build RVR.Framework.sln --configuration Release --no-restore --verbosity minimal

      - name: Run unit tests (exclude integration tests and benchmarks)
        run: |
          dotnet test RVR.Framework.sln \
            --configuration Release \
            --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~Benchmarks" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      # Non-bloquant pendant la stabilisation de la suite (continue-on-error explicite
      # plutôt que `|| true` qui masquait le statut réel du step)
      - name: Run integration tests
        continue-on-error: true
        run: |
          dotnet test RVR.Framework.sln \
            --configuration Release \
            --no-build --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./TestResults \
            --filter "FullyQualifiedName~IntegrationTests"

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Generate test results summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r trx; do
            echo "- Found test result: $trx" >> $GITHUB_STEP_SUMMARY
          done < <(find ./TestResults -name "*.trx" -type f 2>/dev/null)
          echo "" >> $GITHUB_STEP_SUMMARY
          # Count coverage files
          COVERAGE_FILES=$(find ./TestResults -name "coverage.cobertura.xml" -type f 2>/dev/null | wc -l)
          echo "Coverage reports generated: $COVERAGE_FILES" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        if: always()
        with:
          files: TestResults/**/coverage.cobertura.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary (informational)
        run: |
          echo "## Coverage Summary (threshold: ${COVERAGE_THRESHOLD}% — informational)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          BELOW=false
          while IFS= read -r coverage_file; do
            LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$coverage_file" | head -1 || echo "0")
            PCT=$(awk -v r="$LINE_RATE" 'BEGIN{printf "%.2f", r*100}')
            echo "- Coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)" >> $GITHUB_STEP_SUMMARY
            if awk -v r="$LINE_RATE" -v t="$COVERAGE_THRESHOLD" 'BEGIN{exit !(r*100 < t)}'; then
              echo "  - **BELOW THRESHOLD**" >> $GITHUB_STEP_SUMMARY
              BELOW=true
            fi
          done < <(find ./TestResults -name "coverage.cobertura.xml" -type f 2>/dev/null)
          if [ "$BELOW" = "true" ]; then
            echo "::warning::Some coverage reports are below the ${COVERAGE_THRESHOLD}% threshold (informational, non-blocking — Codecov enforces the actual gate)"
          fi

  # Job 4: Code Quality (Format + Analyzers)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # continue-on-error tant que l'arborescence n'a pas été normalisée avec `dotnet format`
      - name: Check code format
        continue-on-error: true
        run: dotnet format RVR.Framework.sln --verify-no-changes --verbosity minimal

  # Job 5: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore RVR.Framework.sln

      - name: Check for vulnerable packages
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Vulnerable Packages" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(dotnet list RVR.Framework.sln package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
          echo "No vulnerable packages found." >> $GITHUB_STEP_SUMMARY

  # Job: SBOM Generation
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore RVR.Framework.sln

      - name: Generate SBOM
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool 2>/dev/null || true
          sbom-tool generate -b . -bc src/ -pn RIVORA -pv ${{ github.sha }} -ps khalilbenaz -nsb https://github.com/khalilbenaz/RIVORA -m .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: _manifest/
          retention-days: 90

  # Job: License Compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Restore transitif complet coûteux — uniquement sur main (la dependency-review PR gate couvre les PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Install license tool
        run: dotnet tool install --global dotnet-project-licenses 2>/dev/null || true

      - name: Check licenses
        run: |
          echo "## License Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          dotnet-project-licenses -i RVR.Framework.sln --include-transitive -u >> $GITHUB_STEP_SUMMARY 2>&1 || true
          # Check for GPL/AGPL licenses (incompatible with MIT)
          OUTPUT=$(dotnet-project-licenses -i RVR.Framework.sln --include-transitive 2>&1 || true)
          if echo "$OUTPUT" | grep -iE "GPL|AGPL|LGPL" | grep -v "MIT" > /dev/null 2>&1; then
            echo "::warning::Potentially incompatible licenses detected (GPL/AGPL). Review required."
          fi

  # Job: Secrets Scan
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact -v --exit-code 1

  # Job: AI Code Review with SARIF output
  ai-review:
    name: AI Code Review (SARIF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    continue-on-error: true
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore CLI project
        run: dotnet restore tools/RVR.CLI/RVR.CLI.csproj

      # NB: pas de positionnel — System.CommandLine (strict) rejette tout argument non déclaré;
      # le chemin passe par --path
      - name: Run AI review with SARIF output
        continue-on-error: true
        run: |
          dotnet run --project tools/RVR.CLI/RVR.CLI.csproj --no-restore -- ai review --path . --all --output sarif --output-file rivora-review.sarif --ci

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('rivora-review.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: rivora-review.sarif
          category: rivora-ai-review
        continue-on-error: true

  # Job: Frontend Build & Lint
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities"

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=./coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        if: always()
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # Job: Frontend E2E (Playwright) — la suite e2e/ existait mais n'était jamais exécutée en CI
  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # --with-deps reste nécessaire même avec cache (deps OS absentes d'un runner frais)
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Job: Docker Build (frontend) — valide le Dockerfile de prod + scan image sur chaque PR
  docker-build:
    name: Docker Build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: rivora-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan frontend image
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 --scanners vuln rivora-frontend:ci

  # Job: Docker Security Scan
  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run Trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --exit-code 1 --scanners vuln .

  # Summary Job
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, tests, code-quality, security, secrets-scan, ai-review, frontend, e2e, docker-build, docker-scan, sbom, license-check]
    if: always()

    steps:
      - name: Create Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Unit & Integration) | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Code Review | ${{ needs.ai-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build (frontend) | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Scan | ${{ needs.docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY

  # Job 6: Publish NuGet Packages (Only on tags)
  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests, security]
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Pack all framework modules
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Packing all packable projects with version $VERSION"
          dotnet pack RVR.Framework.sln -c Release -o ./artifacts /p:PackageVersion=$VERSION -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      # Le `if:` d'un step ne voit pas l'env défini dans ce même step — il faut poser
      # un flag job-level dans un step PRÉCÉDENT via $GITHUB_ENV
      - name: Detect signing certificate
        env:
          NUGET_SIGNING_CERT: ${{ secrets.NUGET_SIGNING_CERT }}
        run: |
          if [ -n "$NUGET_SIGNING_CERT" ]; then
            echo "HAS_SIGNING_CERT=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_CERT=false" >> "$GITHUB_ENV"
            echo "::notice::No signing certificate configured — packages will be pushed unsigned."
          fi

      - name: Sign NuGet packages
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          NUGET_SIGNING_CERT: ${{ secrets.NUGET_SIGNING_CERT }}
          NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        run: |
          echo "$NUGET_SIGNING_CERT" | base64 -d > signing.pfx
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget sign "$pkg" \
              --certificate-path signing.pfx \
              --certificate-password "$NUGET_SIGNING_CERT_PASSWORD" \
              --timestamper http://timestamp.digicert.com
          done
          rm -f signing.pfx

      - name: List generated packages
        run: |
          echo "## Generated NuGet Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la ./artifacts/*.nupkg
          ls -la ./artifacts/*.nupkg >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Validate package count
        run: |
          PACKAGE_COUNT=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l)
          echo "Total packages generated: $PACKAGE_COUNT"
          if [ "$PACKAGE_COUNT" -le 1 ]; then
            echo "::error::Expected more than 1 NuGet package but found $PACKAGE_COUNT. Ensure all framework modules are packable."
            exit 1
          fi
          echo "Package validation passed: $PACKAGE_COUNT packages generated."

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          else
            echo "NUGET_API_KEY not set, skipping NuGet.org push"
          fi

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/khalilbenaz/index.json" --skip-duplicate

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          retention-days: 30
